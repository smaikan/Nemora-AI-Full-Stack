
services:
  api:
    build: ./API
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  client:
    build: ./UI
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    environment:
      SA_PASSWORD: "Serhat@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
